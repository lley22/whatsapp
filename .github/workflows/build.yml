name: 云端自动编译打包 EXE

on: 
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 准备 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 预安装 Windows 必备系统组件
      shell: pwsh
      run: |
        # 强制安装打包和运行所需的最新 C++ 运行库，防止云端虚拟机报错
        winget install Microsoft.VC++2022Redist-x64 --silent --accept-source-agreements --accept-package-agreements

    - name: 4. 安装所需打包依赖
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: 5. 开始编译单文件 EXE
      shell: cmd
      run: |
        chcp 65001
        pyinstaller --onefile --noconsole --clean app.py

    - name: 6. 导出成品下载文件
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp免安装管理器_EXE_成品
        path: dist/app.exe
