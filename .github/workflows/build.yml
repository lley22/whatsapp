name: 云端自动编译打包 EXE

on: 
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. 检出最新优化代码
      uses: actions/checkout@v4

    - name: 2. 准备 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 强制补齐 Windows 底层多媒体及图形环境
      shell: pwsh
      run: |
        # 核心修复补丁：强制安装编译 PySide6 界面所需的系统 VC++ 环境
        winget install Microsoft.VC++2022Redist-x64 --silent --accept-source-agreements --accept-package-agreements

    - name: 4. 安装所需打包依赖 (升级至最新版)
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: 5. 开始编译单文件 EXE (全兼容封装)
      shell: cmd
      run: |
        chcp 65001
        pyinstaller --onefile --noconsole --clean app.py

    - name: 6. 导出完美优化版 EXE 产物
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp免安装管理器_EXE_成品
        path: dist/app.exe
