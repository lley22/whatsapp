name: 云端自动编译打包 EXE

on: 
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. 检出最新优化代码
      uses: uses/checkout@v4
      with:
        repository: ${{ github.repository }}

    - name: 2. 准备 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装所需打包基础工具
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 4. 开始编译单文件 EXE
      run: |
        pyinstaller --onefile --noconsole --clean app.py

    - name: 5. 导出完美优化版 EXE 产物
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp免安装管理器_EXE_成品
        path: dist/app.exe
